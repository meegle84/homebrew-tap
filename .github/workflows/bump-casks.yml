name: Bump casks and formulae

# Weekly: open one pull request per cask or formula whose upstream has a newer release
# (detected by its livecheck block). Nothing is merged automatically.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Homebrew/actions/setup-homebrew@main

      - name: Open a pull request for every outdated cask or formula
        # bash (not the default shell) adds pipefail: a livecheck error fails the run
        shell: bash
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tap="${GITHUB_REPOSITORY_OWNER}/tap"
          brew livecheck --tap "$tap" --newer-only --json --quiet |
            jq -r '.[] | if .cask then "cask \(.cask) \(.version.latest)" else "formula \(.formula) \(.version.latest)" end' |
            while read -r kind name version; do
              brew "bump-$kind-pr" --no-fork --no-browse --version "$version" "$tap/$name"
            done
