name: Bump casks

# Weekly: open one pull request per cask whose upstream has a newer release
# (detected by each cask's livecheck block). Nothing is merged automatically.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Homebrew/actions/setup-homebrew@main

      - name: Open a pull request for every outdated cask
        # bash (not the default shell) adds pipefail: a livecheck error fails the run
        shell: bash
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tap="${GITHUB_REPOSITORY_OWNER}/tap"
          brew livecheck --tap "$tap" --newer-only --json --quiet |
            jq -r '.[] | "\(.cask) \(.version.latest)"' |
            while read -r cask version; do
              brew bump-cask-pr --no-fork --no-browse --version "$version" "$tap/$cask"
            done
